name: Generate RISTANC application documents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document dependency
        run: python -m pip install --upgrade pip python-docx

      - name: Generate CV, competence annex and bank template
        run: python scripts/generate_ristanc_documents.py

      - name: Generate application form working copy
        run: python scripts/generate_ristanc_application_form.py

      - name: Upload generated documents
        uses: actions/upload-artifact@v4
        with:
          name: ristanc-documents
          path: dist/ristanc-private/*.docx
          if-no-files-found: error
          retention-days: 3
